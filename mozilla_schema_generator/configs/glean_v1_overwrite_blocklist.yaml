# Pings blocked from having their glean v1 schema overwritten by the glean v2 schema.
#
# By default every ping's v1 schema is generated from the glean v2 schema, which drops the
# unused distribution subfields. For pings with no distribution metrics this is a no-op, so
# they switch over automatically. Pings that currently have distribution columns would lose
# columns under glean v2, so they are blocked here and stay on glean v1 until their tables
# have been backfilled and swapped (https://mozilla-hub.atlassian.net/browse/DENG-8494).
# Remove a ping from this list once its table swap is done.
#
# Maps app id to the list of pings to keep on glean v1.
#
# This list is the set of stable tables that currently have distribution columns, from:
#   SELECT DISTINCT table_schema, table_name
#   FROM `moz-fx-data-shared-prod.region-us.INFORMATION_SCHEMA.COLUMN_FIELD_PATHS`
#   WHERE table_schema LIKE '%_stable' AND field_path LIKE 'metrics.%_distribution'
