name: Generated Schema Diff
on:
  pull_request:
    paths:
    - 'mozilla_schema_generator/__main__.py'
    - 'mozilla_schema_generator/glean_ping.py'
    - 'mozilla_schema_generator/configs/**'

jobs:
  generate-main:
    name: Generate schemas from main
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          persist-credentials: false
      - name: Add generate_glean.sh from PR HEAD
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --depth=1 origin "$PR_HEAD_SHA"
          git checkout "$PR_HEAD_SHA" -- bin/generate_glean.sh
      - &setup-python
        name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14'
          cache: 'pip'
      - &cache-jst
        name: Cache jsonschema-transpiler
        id: jst-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cargo/bin/jsonschema-transpiler
          key: jst-2.0.1-${{ runner.os }}
      - &install-jst
        name: Install jsonschema-transpiler
        if: steps.jst-cache.outputs.cache-hit != 'true'
        run: cargo install jsonschema-transpiler --version 2.0.1 --locked
      - &add-cargo-path
        name: Add cargo bin to PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - &cache-probes
        name: Restore probe cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .probe_cache
          # Using a coarse key because the actual probes don't matter
          key: probe-cache-${{ github.head_ref }}
          restore-keys: |
            probe-cache-
      - &install-reqs
        name: Install requirements
        run: |
          make install-requirements
          pip install -e .
      - &fetch-mps-metadata
        name: Fetch metadata/ from mozilla-pipeline-schemas
        run: |
          git clone --depth=1 --filter=blob:none --sparse \
            --branch generated-schemas \
            https://github.com/mozilla-services/mozilla-pipeline-schemas.git /tmp/mps
          git -C /tmp/mps sparse-checkout set schemas/metadata
          cp -r /tmp/mps/schemas/metadata ./metadata
      - &generate-schemas
        name: Generate schemas
        run: bin/generate_glean.sh
      - name: Upload main schemas
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: main-schemas
          path: schema_out/

  generate-pr:
    name: Generate schemas from PR
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout PR
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - *setup-python
      - *cache-jst
      - *install-jst
      - *add-cargo-path
      - *cache-probes
      - *install-reqs
      - *fetch-mps-metadata
      - *generate-schemas
      - name: Upload PR schemas
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-schemas
          path: schema_out/

  schema-diff:
    name: Diff PR schemas against main
    runs-on: ubuntu-latest
    needs: [generate-main, generate-pr]
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true
      - name: Download main schemas
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: main-schemas
          path: /tmp/main-schemas
      - name: Download PR schemas
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr-schemas
          path: /tmp/pr-schemas
      - name: Push schemas to ci-schema-diff-test branch
        id: push-diff
        env:
          DIFF_BRANCH: ci-schema-diff-test
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MAIN_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Start the diff branch from an empty tree so it doesn't have any history
          git checkout --orphan "$DIFF_BRANCH"
          git rm -rf . > /dev/null 2>&1 || true
          git clean -fdx

          # Commit 1: schemas generated from main
          mkdir -p schema_out
          cp -r /tmp/main-schemas/. schema_out/
          git add schema_out
          git commit --allow-empty -m "generated schemas from main (${MAIN_SHA:0:8})"

          # Commit 2: schemas generated from PR head
          rm -rf schema_out
          mkdir -p schema_out
          cp -r /tmp/pr-schemas/. schema_out/
          git add -A schema_out
          git commit --allow-empty -m "PR #${PR_NUMBER}: generated schemas from ${PR_HEAD_SHA:0:8}"

          git push --force origin "$DIFF_BRANCH"

          DIFF_COMMIT_SHA=$(git rev-parse HEAD)
          echo "diff_commit_sha=$DIFF_COMMIT_SHA" >> "$GITHUB_OUTPUT"
          {
            echo "## Generated Schema Diff Branch"
            echo ""
            echo "Pushed to [\`$DIFF_BRANCH\`](https://github.com/${GITHUB_REPOSITORY}/tree/${DIFF_BRANCH})."
            echo ""
            echo "View this PR's schema changes: [commit ${DIFF_COMMIT_SHA:0:7}](https://github.com/${GITHUB_REPOSITORY}/commit/${DIFF_COMMIT_SHA})"
          } >> "$GITHUB_STEP_SUMMARY"
